<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found | Imamu Qaloon Academy (IQA)</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 20px;
        background:
          radial-gradient(circle at top left, rgba(184, 138, 65, 0.12), transparent 28%),
          linear-gradient(135deg, #f8f2e7 0%, #f2ebdd 100%);
      }
      .not-found {
        width: min(720px, 100%);
        text-align: center;
        background: rgba(255,255,255,0.8);
        border: 1px solid rgba(18, 61, 56, 0.12);
        border-radius: 28px;
        padding: 48px 24px;
        box-shadow: 0 24px 48px rgba(18, 61, 56, 0.08);
      }
      .not-found h1 {
        font-size: clamp(3rem, 10vw, 6rem);
        margin-bottom: 0.6rem;
        color: var(--green);
      }
      .not-found p {
        max-width: 520px;
        margin: 0 auto 1.7rem;
      }
      .not-found .actions {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 12px;
      }
    </style>
  </head>
  <body>
    <main class="not-found">
      <span class="eyebrow">404 error</span>
      <h1>Page not found</h1>
      <p>The page you’re looking for may have moved, been removed, or the link may be incorrect.</p>
      <div class="actions">
        <a class="button" href="/">Back to home</a>
        <a class="button secondary" href="/contact.html">Contact us</a>
      </div>
    </main>
  </body>
</html>
